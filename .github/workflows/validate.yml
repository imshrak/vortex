name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Luau, StyLua, and Rojo
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force .tools | Out-Null
          gh release download 0.742 --repo luau-lang/luau --pattern luau-windows.zip --dir .tools
          Expand-Archive .tools/luau-windows.zip .tools -Force
          gh release download v2.6.0 --repo JohnnyMorganz/StyLua --pattern stylua-windows-x86_64.zip --dir .tools
          Expand-Archive .tools/stylua-windows-x86_64.zip .tools -Force
          gh release download v7.7.1 --repo rojo-rbx/rojo --pattern rojo-7.7.1-windows-x86_64.zip --dir .tools
          Expand-Archive .tools/rojo-7.7.1-windows-x86_64.zip .tools -Force
      - name: Check formatting
        shell: pwsh
        run: ./.tools/stylua.exe --check --syntax Luau Library.lua Designer.lua Example.lua addons designer examples tests
      - name: Compile and check behavior
        shell: pwsh
        run: ./tests/run.ps1 -Luau ./.tools/luau.exe -Compiler ./.tools/luau-compile.exe
      - name: Build Studio example
        shell: pwsh
        run: |
          ./.tools/rojo.exe build default.project.json --output .tools/VortexUI.rbxlx
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./.tools/rojo.exe build designer.project.json --output .tools/VortexDesigner.rbxlx
